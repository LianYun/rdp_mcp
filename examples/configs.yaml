# 复制到 ./.remoter/configs.yaml 或 ~/.remoter/configs.yaml
server:
  listen: 127.0.0.1:8765        # MCP: /mcp   管理 API: /api/v1
  mcp_token: ${REMOTER_MCP_TOKEN}   # 可选；监听非本地地址时必填
  screenshot_max_width: 1280
  audit:
    enabled: true
    retention_days: 7
  # ocr:                        # screenshot 的 ocr 参数；需安装 tesseract
  #   languages: chi_sim+eng

defaults:
  port: 3389
  width: 1920
  height: 1080
  security: auto             # nla | tls | rdp | auto
  cert: tofu                 # tofu | ignore | fingerprint
  auto_connect: false
  idle_disconnect: 30m

machines:
  - name: dev-pc
    description: "开发机，装了 VS 和 Chrome"
    host: 192.168.1.20
    username: alice
    password: keychain:dev-pc        # remoter-mcp secret set dev-pc
    domain: CORP
    tags: [dev]

  - name: test-vm
    description: "测试虚拟机"
    host: 192.168.1.30
    username: tester
    password: ${TEST_VM_PASSWORD}

  - name: build-server
    description: "构建服务器"
    host: build.example.com
    port: 3390
    username: Administrator
    password_cmd: "security find-generic-password -s rdp-build -w"
    width: 2560
    height: 1440
    cert: fingerprint
    cert_fingerprint: "sha256:AB:CD:EF:..."

  - name: mac-mini
    description: "Mac mini，跑 iOS 构建"
    protocol: vnc                    # macOS：屏幕共享（VNC）+ 远程登录（SSH）
    host: 192.168.1.40
    username: alice                  # Mac 账号短名，VNC 与 SSH 共用
    password: ${MAC_MINI_PASSWORD}   # 写法与 Windows 机器相同；Linux 上放 ~/.remoter/.env
    # port: 5900                     # 默认 5900，不继承 defaults.port
    # ssh_port: 22
    # enable_ssh: true               # false 时 run_command/file/clipboard 不可用
