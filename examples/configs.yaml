# 复制到 ./.rdp_mcp/configs.yaml 或 ~/.rdp_mcp/configs.yaml
server:
  listen: 127.0.0.1:8765        # MCP 端点 http://127.0.0.1:8765/mcp
  auth_token: ${RDP_MCP_TOKEN}  # 可选；监听非本地地址时必填
  screenshot_max_width: 1280

defaults:
  port: 3389
  width: 1920
  height: 1080
  security: auto             # nla | tls | rdp | auto
  cert: tofu                 # tofu | ignore | fingerprint
  auto_connect: false
  idle_disconnect: 30m

machines:
  - name: dev-pc
    description: "开发机，装了 VS 和 Chrome"
    host: 192.168.1.20
    username: alice
    password: ${DEV_PC_PASSWORD}
    domain: CORP
    tags: [dev]

  - name: build-server
    description: "构建服务器"
    host: build.example.com
    port: 3390
    username: Administrator
    password_cmd: "security find-generic-password -s rdp-build -w"
    width: 2560
    height: 1440
    cert: fingerprint
    cert_fingerprint: "sha256:AB:CD:EF:..."
